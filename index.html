<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Sports Leaderboard TV</title>
    <!-- Fonts: Vazirmatn for Persian, Orbitron for Numbers -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #09090b;
            --gold: #fbbf24;
            --silver: #e2e8f0;
            --bronze: #cd7f32;
            --accent-cyan: #22d3ee;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --glass-bg: rgba(20, 20, 25, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            /*
               IMPORTANT: FOR PRODUCTION, CHANGE THE URL BELOW TO url('./back.jpg')
               نکته مهم: برای محیط عملیاتی، آدرس زیر را به url('./back.jpg') تغییر دهید.
            */
            background-image: linear-gradient(rgba(9, 9, 11, 0.75), rgba(9, 9, 11, 0.75)), url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Minimalist Header */
        header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3rem;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(to left, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.4));
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            padding: 0.2rem 0.8rem;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: #ef4444;
            animation: pulse-border 2s infinite;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes pulse-border {
            0%, 100% { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 0px rgba(239, 68, 68, 0); }
            50% { border-color: rgba(239, 68, 68, 1); box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
        }

        /* Leaderboard Container */
        main {
            flex-grow: 1;
            padding: 0.8rem 3rem;
            display: flex;
            flex-direction: column;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px; /* Small gap to fit 15 students */
            height: 100%;
        }

        /* Student Card - Glassmorphism */
        .student-card {
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            height: 58px; /* Optimized for 1080p / 15 cards */
            padding: 0 1.2rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }

        /* Rank Colors & Special Effects */
        .rank-1 {
            border: 1.5px solid var(--gold);
            box-shadow: inset 0 0 15px rgba(251, 191, 36, 0.1), 0 0 15px rgba(251, 191, 36, 0.1);
            animation: aura-gold 3s infinite;
        }
        .rank-2 { border: 1px solid var(--silver); box-shadow: 0 0 10px rgba(226, 232, 240, 0.1); }
        .rank-3 { border: 1px solid var(--bronze); box-shadow: 0 0 10px rgba(205, 127, 50, 0.1); }

        @keyframes aura-gold {
            0%, 100% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.2); }
            50% { box-shadow: 0 0 25px rgba(251, 191, 36, 0.4); }
        }

        .rank-num-container {
            width: 70px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            font-style: italic;
            color: rgba(255, 255, 255, 0.3);
            direction: ltr; /* Numbers always LTR */
        }

        .rank-1 .rank-num-container { color: var(--gold); animation: pulse-text 2s infinite; }
        .rank-2 .rank-num-container { color: var(--silver); }
        .rank-3 .rank-num-container { color: var(--bronze); }

        @keyframes pulse-text {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px var(--gold)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 8px var(--gold)); }
        }

        .crown-icon {
            font-size: 1.2rem;
            margin-right: 2px;
        }

        /* Avatar with Glow Ring */
        .avatar-container {
            width: 42px;
            height: 42px;
            margin: 0 1rem;
            border-radius: 50%;
            position: relative;
            padding: 2px;
            background: rgba(255,255,255,0.1);
        }

        .rank-1 .avatar-container { background: linear-gradient(45deg, var(--gold), #fef3c7); }
        .rank-2 .avatar-container { background: linear-gradient(45deg, var(--silver), #fff); }
        .rank-3 .avatar-container { background: linear-gradient(45deg, var(--bronze), #ffedd5); }

        .avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-dark);
        }

        .student-name {
            font-size: 1.4rem;
            font-weight: 700;
            flex-grow: 1;
            padding-right: 0.5rem;
            letter-spacing: 0.5px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* Score Section */
        .score-section {
            width: 180px;
            text-align: left;
            direction: ltr; /* Score numbers LTR */
        }

        .score-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--accent-cyan);
            display: inline-block;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        /* Score Pop Effect */
        .score-pop {
            color: var(--accent-green) !important;
            transform: scale(1.25);
            text-shadow: 0 0 20px var(--accent-green);
        }

        /* Vue Transitions */
        .list-move {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .list-enter-active, .list-leave-active {
            transition: all 0.5s ease;
        }
        .list-enter-from, .list-leave-to {
            opacity: 0;
            transform: translateX(-30px);
        }

        /* Fallback / Empty */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 1rem;
            font-size: 1.5rem;
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div id="app">
        <header>
            <div class="logo-container">
                <div class="logo-text">TIMING BOARD</div>
                <div class="live-indicator">
                    <div class="live-dot"></div>
                    LIVE
                </div>
            </div>
            <div style="font-family: 'Orbitron', sans-serif; font-size: 0.9rem; color: rgba(255,255,255,0.5);">
                RANKING PERFORMANCE
            </div>
        </header>

        <main>
            <transition-group name="list" tag="div" class="leaderboard-list">
                <div v-for="(student, index) in sortedStudents"
                     :key="student.id"
                     class="student-card"
                     :class="getRankClass(index)">

                    <div class="rank-num-container">
                        <span v-if="index === 0" class="crown-icon">👑</span>
                        {{ index + 1 }}
                    </div>

                    <div class="avatar-container">
                        <img :src="getDriveUrl(student.photoUrl) || getFallbackAvatar(student.name)"
                             @error="handleImgError">
                    </div>

                    <div class="student-name">{{ student.name }}</div>

                    <div class="score-section">
                        <span class="score-value" :class="{ 'score-pop': student.isPopping }">
                            {{ formatScore(student.id) }}
                        </span>
                    </div>
                </div>
            </transition-group>

            <div v-if="students.length === 0" class="loading-state">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p>در حال بارگذاری لیدربورد حرفه‌ای...</p>
            </div>
        </main>
    </div>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Firebase v9 Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const { createApp, ref, computed, onMounted, watch, reactive } = Vue;

        createApp({
            setup() {
                const students = ref([]);
                const displayScores = reactive({}); // Stores the "counting" value for each student
                const firebaseURL = "https://jalase4shanbe-default-rtdb.firebaseio.com/";

                // Rank Classes
                const getRankClass = (index) => {
                    if (index === 0) return 'rank-1';
                    if (index === 1) return 'rank-2';
                    if (index === 2) return 'rank-3';
                    return '';
                };

                // Sort: Score DESC, then lastUpdated DESC (Tie-breaker)
                const sortedStudents = computed(() => {
                    return [...students.value].sort((a, b) => {
                        if (b.score !== a.score) {
                            return b.score - a.score;
                        }
                        return (b.lastUpdated || 0) - (a.lastUpdated || 0);
                    });
                });

                // Google Drive URL Converter
                const getDriveUrl = (url) => {
                    if (!url) return null;
                    const driveRegex = /(?:drive\.google\.com\/(?:file\/d\/|open\?id=)|docs\.google\.com\/file\/d\/)([a-zA-Z0-9_-]+)/;
                    const match = url.match(driveRegex);
                    if (match && match[1]) {
                        return `https://drive.google.com/uc?export=view&id=${match[1]}`;
                    }
                    return url;
                };

                const getFallbackAvatar = (name) => {
                    return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=22d3ee&color=0f172a&bold=true`;
                };

                const handleImgError = (e) => {
                    e.target.src = `https://ui-avatars.com/api/?background=random&color=fff&bold=true&name=User`;
                };

                // Score Counting Animation
                const animateScore = (studentId, start, end) => {
                    if (displayScores[studentId] === undefined) {
                        displayScores[studentId] = start;
                    }

                    const duration = 500; // 0.5 seconds
                    const startTime = performance.now();
                    const initialValue = displayScores[studentId];
                    const diff = end - initialValue;

                    const student = students.value.find(s => s.id === studentId);
                    if (student) student.isPopping = true;

                    const update = (now) => {
                        const elapsed = now - startTime;
                        const progress = Math.min(elapsed / duration, 1);

                        // Ease out quad
                        const ease = progress * (2 - progress);
                        displayScores[studentId] = Math.floor(initialValue + (diff * ease));

                        if (progress < 1) {
                            requestAnimationFrame(update);
                        } else {
                            displayScores[studentId] = end;
                            if (student) {
                                setTimeout(() => {
                                    student.isPopping = false;
                                }, 300);
                            }
                        }
                    };
                    requestAnimationFrame(update);
                };

                const formatScore = (id) => {
                    const val = displayScores[id];
                    return val !== undefined ? val.toLocaleString() : '0';
                };

                // Firebase Initialization
                const initFirebase = () => {
                    firebase.initializeApp({ databaseURL: firebaseURL });
                    const db = firebase.database();
                    const studentsRef = db.ref('students');

                    studentsRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const newList = Object.values(data).map(s => {
                                const oldStudent = students.value.find(prev => prev.id === s.id);
                                return {
                                    ...s,
                                    isPopping: oldStudent ? oldStudent.isPopping : false
                                };
                            });

                            // Check for score updates to trigger animation
                            newList.forEach(newStudent => {
                                const oldStudent = students.value.find(s => s.id === newStudent.id);
                                if (!oldStudent) {
                                    displayScores[newStudent.id] = newStudent.score;
                                } else if (newStudent.score !== oldStudent.score) {
                                    animateScore(newStudent.id, oldStudent.score, newStudent.score);
                                }
                            });

                            students.value = newList;
                        } else {
                            // Fallback dummy data if Firebase is empty
                            students.value = [
                                { id: 1, name: "علی محمدی", score: 1250, lastUpdated: 100 },
                                { id: 2, name: "سارا احمدی", score: 1420, lastUpdated: 101 },
                                { id: 3, name: "رضا ناصری", score: 980, lastUpdated: 99 },
                                { id: 4, name: "مریم گلی", score: 1100, lastUpdated: 105 },
                                { id: 5, name: "امیر حسین", score: 1420, lastUpdated: 110 }, // Tie with Sara, but Amir is newer
                                { id: 6, name: "هانیه راد", score: 850, lastUpdated: 90 },
                                { id: 7, name: "پوریا پارسا", score: 1550, lastUpdated: 120 }
                            ];
                            students.value.forEach(s => displayScores[s.id] = s.score);
                        }
                    });
                };

                onMounted(() => {
                    initFirebase();
                });

                return {
                    students,
                    sortedStudents,
                    getRankClass,
                    getDriveUrl,
                    getFallbackAvatar,
                    handleImgError,
                    formatScore
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
