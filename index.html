<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلویزیون لیدربورد کلاس</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: rgba(24, 24, 27, 0.8);
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #d97706;
            --accent-blue: #0ea5e9;
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 20% 30%, rgba(14, 165, 233, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4rem;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(to right, #0ea5e9, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(14, 165, 233, 0.5));
        }

        .live-tag {
            font-family: 'Orbitron', sans-serif;
            background: #ef4444;
            padding: 0.2rem 1rem;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        main {
            flex-grow: 1;
            padding: 1.5rem 4rem;
            position: relative;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        /* Card Styles */
        .student-card {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 4px solid var(--accent-blue);
            height: 55px; /* Adjusted to fit 15 students comfortably */
            padding: 0 1.5rem;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Top 3 Special Styles */
        .rank-1 { border-right: 5px solid var(--gold); box-shadow: inset -10px 0 20px rgba(251, 191, 36, 0.1); }
        .rank-2 { border-right: 5px solid var(--silver); box-shadow: inset -10px 0 20px rgba(148, 163, 184, 0.1); }
        .rank-3 { border-right: 5px solid var(--bronze); box-shadow: inset -10px 0 20px rgba(217, 119, 6, 0.1); }

        .rank-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            width: 60px;
            color: rgba(255, 255, 255, 0.3);
            font-style: italic;
        }

        .rank-1 .rank-number { color: var(--gold); text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
        .rank-2 .rank-number { color: var(--silver); text-shadow: 0 0 10px rgba(148, 163, 184, 0.5); }
        .rank-3 .rank-number { color: var(--bronze); text-shadow: 0 0 10px rgba(217, 119, 6, 0.5); }

        .avatar-container {
            width: 40px;
            height: 40px;
            margin-right: 1.5rem; /* Using margin-right because of RTL layout, but F1 layout is usually LTR-ish */
            margin-left: 1.5rem;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .student-name {
            font-size: 1.4rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-grow: 1;
        }

        .score-container {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-blue);
            min-width: 120px;
            text-align: left;
        }

        /* FLIP Animation */
        .list-move {
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Score Pop Animation */
        .score-pop {
            animation: scorePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #4ade80 !important;
        }

        @keyframes scorePop {
            0% { transform: scale(1); }
            30% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Glass Glow for Top 3 */
        .rank-1::after, .rank-2::after, .rank-3::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
            pointer-events: none;
        }

        /* Empty state */
        .empty-msg {
            text-align: center;
            margin-top: 10rem;
            font-size: 2rem;
            color: var(--silver);
        }
    </style>
</head>
<body>

    <div id="app">
        <header>
            <div class="logo">Timing Board</div>
            <div class="live-tag">
                <span style="width: 8px; height: 8px; background: white; border-radius: 50%;"></span>
                LIVE UPDATES
            </div>
        </header>

        <main>
            <transition-group name="list" tag="div" class="leaderboard-list">
                <div v-for="(student, index) in sortedStudents"
                     :key="student.id"
                     class="student-card"
                     :class="'rank-' + (index + 1)">

                    <div class="rank-number">{{ index + 1 }}</div>

                    <div class="avatar-container">
                        <img :src="student.photoUrl || getFallbackAvatar(student.name)" @error="handleImgError">
                    </div>

                    <div class="student-name">{{ student.name }}</div>

                    <div class="score-container" :class="{ 'score-pop': student.recentUpdate }">
                        {{ student.score.toLocaleString() }}
                    </div>
                </div>
            </transition-group>

            <div v-if="students.length === 0" class="empty-msg">
                در حال بارگذاری اطلاعات...
            </div>
        </main>
    </div>

    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;

        createApp({
            setup() {
                const students = ref([]);
                const firebaseURL = "https://jalase4shanbe-default-rtdb.firebaseio.com/";

                // Sort students descending by score
                const sortedStudents = computed(() => {
                    return [...students.value].sort((a, b) => b.score - a.score);
                });

                // Initialize Firebase
                const initFirebase = () => {
                    if (typeof firebase === 'undefined') {
                        console.error("Firebase not loaded");
                        loadDummyData();
                        return;
                    }

                    firebase.initializeApp({ databaseURL: firebaseURL });
                    const db = firebase.database();
                    const studentsRef = db.ref('students');

                    studentsRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const newList = Object.values(data).map(s => ({
                                ...s,
                                recentUpdate: false
                            }));

                            // Find which student score increased to trigger animation
                            if (students.value.length > 0) {
                                newList.forEach(newStudent => {
                                    const oldStudent = students.value.find(s => s.id === newStudent.id);
                                    if (oldStudent && newStudent.score > oldStudent.score) {
                                        newStudent.recentUpdate = true;
                                        setTimeout(() => {
                                            newStudent.recentUpdate = false;
                                        }, 1000);
                                    }
                                });
                            }

                            students.value = newList;
                        } else {
                            loadDummyData();
                        }
                    }, (error) => {
                        console.error("Firebase error:", error);
                        loadDummyData();
                    });
                };

                const loadDummyData = () => {
                    console.log("Loading dummy data...");
                    const dummy = [
                        { id: 1, name: "علی محمدی", score: 1250, photoUrl: "" },
                        { id: 2, name: "سارا احمدی", score: 1420, photoUrl: "" },
                        { id: 3, name: "رضا ناصری", score: 980, photoUrl: "" },
                        { id: 4, name: "مریم گلی", score: 1100, photoUrl: "" },
                        { id: 5, name: "امیر حسین", score: 1350, photoUrl: "" },
                        { id: 6, name: "هانیه راد", score: 850, photoUrl: "" },
                        { id: 7, name: "پوریا پارسا", score: 1550, photoUrl: "" },
                    ];
                    students.value = dummy;
                };

                const getFallbackAvatar = (name) => {
                    return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random&color=fff&bold=true`;
                };

                const handleImgError = (e) => {
                    e.target.src = 'https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y';
                };

                onMounted(() => {
                    initFirebase();
                });

                return {
                    students,
                    sortedStudents,
                    getFallbackAvatar,
                    handleImgError
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
